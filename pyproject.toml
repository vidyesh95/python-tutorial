[project]
name = "python-tutorial"
version = "0.1.0"
description = "Python from basics to advanced, plus FastAPI backend, cloud, applied ML/LLM, robotics infra and forward-deployed engineering tracks."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
advanced = ["pydantic>=2.9", "typer>=0.13"]
backend = [
    "fastapi[standard]==0.165.0",
    "sqlalchemy>=2.0",
    "sqlmodel==0.0.50",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "redis>=5.2",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "fakeredis>=2.26",
    "arq>=0.26",
    "pwdlib[argon2]>=0.2",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "pytest-asyncio>=0.24",
]
cloud = [
    "boto3>=1.35",
    "moto[s3,dynamodb,sqs,sns,awslambda]>=5.0",
    "google-cloud-storage>=2.19",
    "kubernetes>=31.0",
    "mangum>=0.19",
]
ml = [
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "ollama>=0.4",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2",
]
ml-torch = ["torch>=2.6", "transformers>=4.48", "peft>=0.14", "accelerate>=1.2"]
robotics = [
    "numpy>=2.1",
    "mcap>=1.2",
    "rosbags>=0.10",
    "pyserial>=3.5",
    "python-can>=4.4",
    "cantools>=40.0",
    "onnx>=1.17",
    "mujoco>=3.2",
    "fastapi[standard]==0.165.0",
    "httpx>=0.28",
]
fde = [
    "polars>=1.15",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "httpx>=0.28",
    "respx>=0.21",
    "tenacity>=9.0",
    "authlib>=1.3",
    "pyjwt>=2.10",
    "fastapi[standard]==0.165.0",
    "streamlit>=1.40",
    "gradio>=5.0",
    "anthropic>=0.40",
]

[tool.uv]
default-groups = ["dev", "advanced"]

[tool.pytest.ini_options]
testpaths = ["t01_fundamentals", "t02_intermediate", "t03_advanced", "t04_fastapi_backend", "t05_cloud_engineering", "t06_applied_ml_llm", "t07_robotics_infra", "t08_forward_deployed"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib -q"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Lesson demonstrates str()/int()/float() constructors on purpose.
"t01_fundamentals/m_02_data_types.py" = ["UP018", "E402"]
