# Local PostgreSQL for the FastAPI track.
#
#   docker compose -f t04_fastapi_backend/docker/compose.postgres.yaml up -d     # start
#   docker compose -f t04_fastapi_backend/docker/compose.postgres.yaml ps        # status/health
#   docker compose -f t04_fastapi_backend/docker/compose.postgres.yaml logs -f db
#   docker compose -f t04_fastapi_backend/docker/compose.postgres.yaml down      # stop (keeps data)
#   docker compose -f t04_fastapi_backend/docker/compose.postgres.yaml down -v   # stop + DELETE data
#
# Then point the app at it:
#   export DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/appdb
#
# These credentials are for LOCAL DEVELOPMENT only. Override them with env vars or a .env file:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT

name: python-tutorial

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
